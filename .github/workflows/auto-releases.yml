name: Auto FPV Releases

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check new releases
        env:
          AR_WEBHOOK_UPDATES: ${{ secrets.AR_WEBHOOK_UPDATES }}
          EN_WEBHOOK_UPDATES: ${{ secrets.EN_WEBHOOK_UPDATES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_releases.py

      - name: Save state
        run: |
          git config user.name "GyroGhost"
          git config user.email "111621931+GyroGhost@users.noreply.github.com"
          git add state/releases.json
          git diff --cached --quiet || git commit -m "Update release state"
          git push
